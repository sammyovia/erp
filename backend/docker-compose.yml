version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: e3os_db
      POSTGRES_USER: e3os_user
      POSTGRES_PASSWORD: e3os_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=e3os_db
      - DB_USER=e3os_user
      - DB_PASSWORD=e3os_password
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A e3os worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_NAME=e3os_db
      - DB_USER=e3os_user
      - DB_PASSWORD=e3os_password
      - DB_HOST=db
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
